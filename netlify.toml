[build]
  command = "npm run build && npm run check"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/nguoi-mua"
  to = "/FOODSAVE_USER.html"
  status = 302

[[redirects]]
  from = "/ung-dung"
  to = "/FOODSAVE_APP.html"
  status = 302

[[redirects]]
  from = "/doi-tac"
  to = "/FOODSAVE_PARTNER.html"
  status = 302

[[redirects]]
  from = "/tu-thien"
  to = "/FOODSAVE_CHARITY.html"
  status = 302

[[redirects]]
  from = "/tinh-nguyen"
  to = "/FOODSAVE_VOLUNTEER.html"
  status = 302

[[redirects]]
  from = "/quan-tri"
  to = "/ADMIN_FOODSAVE.html"
  status = 302

[[redirects]]
  from = "/foodsave_partner"
  to = "/FOODSAVE_PARTNER.html"
  status = 302

[[redirects]]
  from = "/foodsave_user"
  to = "/FOODSAVE_USER.html"
  status = 302

[[redirects]]
  from = "/foodsave_charity"
  to = "/FOODSAVE_CHARITY.html"
  status = 302

[[redirects]]
  from = "/foodsave_app"
