<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Trang thử vị trí</title>
  <link rel="stylesheet" href="/frontend/foodsave-location.css">
</head>
<body>
  <h1>Trang thử FoodSaveLocation</h1>
  <script src="/frontend/foodsave-location.js"></script>
  <script>
    // window.__auth / window.__actor đổi được từ test để giả lập đăng xuất / đổi tài khoản
    window.FoodSaveLocation.init({
      apiBase: '/api/v1',
      getAuthHeader: function () { return window.__auth === undefined ? 'Bearer test-token' : window.__auth; },
      getActorKey: function () { return window.__actor === undefined ? 'customer:u1' : window.__actor; },
      promptText: window.__promptText,
      serverSync: window.__serverSync
    });
  </script>
</body>
</html>
