# Tác vụ đổi nhãn/giá và thông báo, chạy mỗi 5 phút
[functions."label-automation"]
  schedule = "*/5 * * * *"

# Tác vụ đơn hàng (hạn thanh toán, vắng mặt, nhắc lấy hàng), chạy mỗi 5 phút
[functions."order-automation"]
  schedule = "*/5 * * * *"

# HTTP Security Headers toàn trang (CSP ở chế độ Report-Only để không chặn nhầm tài nguyên live)
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(self), geolocation=(self), microphone=()"
    Content-Security-Policy-Report-Only = "default-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com https://cdn.jsdelivr.net; connect-src 'self' https: wss:; frame-ancestors 'self'"

# Trang HTML luôn lấy bản mới nhất
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# Service worker: luôn lấy bản mới, được phép điều khiển cả trang gốc
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Manifest PWA
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Cổng quản trị mới: luôn lấy bản mới và siết chống nhúng/rò referrer
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
